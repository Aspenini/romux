[package]
name = "romux-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
romux = { path = "..", features = ["all-formats", "testkit"] }

# Keep the fuzz crate out of the main workspace.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "probe_all"
path = "fuzz_targets/probe_all.rs"
test = false
doc = false

